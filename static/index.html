<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TypeBridge</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #111827; color: #e5e7eb;
         font: 16px system-ui, sans-serif; padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
  h1 { font-size: 18px; margin: 12px 0 8px; }
  textarea { flex: 1; width: 100%; resize: none; font: inherit; padding: 12px; border-radius: 10px;
             border: 1px solid #374151; background: #1f2937; color: inherit; }
  input { width: 100%; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #374151;
          background: #1f2937; color: inherit; margin: 8px 0; }
  button { width: 100%; font: inherit; font-weight: 600; padding: 14px; margin: 8px 0; border: 0;
           border-radius: 10px; background: #2563eb; color: #fff; }
  button:disabled { opacity: .5; }
  #status { min-height: 1.4em; font-size: 14px; color: #9ca3af; margin-bottom: 8px; }
</style>
</head>
<body>
<h1>TypeBridge</h1>
<textarea id="text" placeholder="Text to type on laptop…" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
<input id="token" type="password" placeholder="Token (from server output)" autocomplete="off">
<label>Speed: <select id="speed" style="font:inherit;padding:6px;border-radius:8px;background:#1f2937;color:inherit;border:1px solid #374151">
  <option value="0.01">Fast (10 ms/char)</option>
  <option value="0.05">Human (50 ms/char)</option>
  <option value="0.15">Slow (150 ms/char)</option>
</select></label>
<label><input id="live" type="checkbox" style="width:auto;margin:0 6px 0 0">Live: type as you go (no Send)</label>
<button id="send">Send</button>
<button id="stop" style="background:#dc2626">Stop</button>
<div id="status"></div>
<script>
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search).get("token");
  if (q) { localStorage.setItem("token", q); history.replaceState(null, "", "/"); }
  $("token").value = localStorage.getItem("token") || "";
  $("token").oninput = () => localStorage.setItem("token", $("token").value);

  // Live mode: diff textarea against what was last sent. Laptop caret is assumed to sit at the
  // end of the sent text, so an edit = Left x suffix, Backspace x removed, type inserted, Right x suffix.
  let sent = [], queue = Promise.resolve();
  const post = text => fetch("/type", { method: "POST", headers: { "X-Token": $("token").value },
                                        body: JSON.stringify({ text, delay: +$("speed").value }) });
  $("speed").value = localStorage.getItem("speed") || "0.01";
  $("speed").onchange = () => localStorage.setItem("speed", $("speed").value);
  $("live").onchange = () => { sent = $("live").checked ? Array.from($("text").value) : []; };
  $("text").oninput = () => {
    if (!$("live").checked) return;
    const now = Array.from($("text").value);
    let p = 0; while (p < sent.length && p < now.length && sent[p] === now[p]) p++;
    let q = 0; while (q < sent.length - p && q < now.length - p && sent[sent.length - 1 - q] === now[now.length - 1 - q]) q++;
    const delta = "\x11".repeat(q) + "\b".repeat(sent.length - p - q)
                + now.slice(p, now.length - q).join("") + "\x12".repeat(q);
    sent = now;
    if (!delta) return;
    queue = queue.then(() => post(delta)).then(r => {
      $("status").textContent = r.ok ? "Live" : `Error ${r.status}: ${r.statusText}`;
    }, () => { $("status").textContent = "Server unreachable"; });
  };

  $("send").onclick = async () => {
    const text = $("text").value;
    if (!text) return;
    if ($("live").checked) { $("text").value = ""; sent = []; return; }  // already typed; just clear
    $("send").disabled = true; $("status").textContent = "Typing…";
    try {
      const r = await post(text);
      if (r.ok) { $("text").value = ""; $("status").textContent = `Typed ${text.length} chars`; }
      else $("status").textContent = `Error ${r.status}: ${r.statusText}`;
    } catch (e) { $("status").textContent = "Server unreachable"; }
    $("send").disabled = false;
  };
  $("stop").onclick = async () => {
    try {
      const r = await fetch("/stop", { method: "POST", headers: { "X-Token": $("token").value } });
      $("status").textContent = r.ok ? "Stopped" : `Error ${r.status}: ${r.statusText}`;
    } catch (e) { $("status").textContent = "Server unreachable"; }
  };
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
